services:
  bsr:
    build: .
    image: bsr-market-intelligence:local
    container_name: bsr-market-intelligence
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BSR_ENV: ${BSR_ENV:-development}
      BSR_SECRET_KEY: ${BSR_SECRET_KEY:-bsr-market-intel-secret-key-development-32chars}
      BSR_DATABASE: /data/bsr.db
      BSR_SEED_ON_START: ${BSR_SEED_ON_START:-1}
      BSR_PORT: "8000"
      BSR_THREADS: ${BSR_THREADS:-4}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    volumes:
      # Mount the local database directory so pre-seeded data and schema are immediately available and persisted
      - ./instance:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db-admin:
    image: coleifer/sqlite-web:latest
    container_name: bsr-db-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./instance:/data
    command: ["sqlite_web", "-H", "0.0.0.0", "-p", "8080", "/data/bsr.db"]
    depends_on:
      - bsr
